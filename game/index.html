<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starfall Salvage — haul the quota, dodge the rocks</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05081a;
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #wrap {
        position: relative;
        line-height: 0;
      }
      canvas {
        display: block;
        width: min(960px, 96vw);
        height: auto;
        background: #0b1030;
        border-radius: 6px;
        box-shadow: 0 0 60px rgba(60, 110, 255, 0.25);
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="960" height="600"></canvas>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
